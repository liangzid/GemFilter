[project]
name = "gemfilter"
version = "0.2.2"
description = "Privacy Protection Filter - Detect and protect sensitive information in text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
gemfilter = "gemfilter.cli:main"
gemfilter-server = "gemfilter.server.main:main"
